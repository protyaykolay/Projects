<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>


        <!-- Add Expense Form -->

        <div class="form-section">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                    >

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <button type="submit" id="addButton">
                    Add Expense
                </button>

            </form>

        </div>


        <!-- Total Expense -->

        <div class="total-section">

            <h2>Total Expense</h2>

            <p>
                ₹<span id="totalExpense">0.00</span>
            </p>

        </div>


        <!-- Search and Filter -->

        <div class="search-filter-section">

            <div>

                <label for="searchInput">
                    Search
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search expense..."
                >

            </div>


            <div>

                <label for="filterCategory">
                    Category
                </label>

                <select id="filterCategory">

                    <option value="All">
                        All
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>

        </div>


        <!-- Expense Table -->

        <div class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>Description</th>

                        <th>Amount</th>

                        <th>Category</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="expenseList">

                    <!-- Expenses will appear here -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
