<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <h1>Library Management System</h1>


        <!-- Add Book Section -->

        <div class="form-section">

            <h2>Add Book</h2>


            <form id="bookForm">


                <!-- Book ID -->

                <div class="form-group">

                    <label for="bookId">
                        Book ID
                    </label>

                    <input
                        type="text"
                        id="bookId"
                        placeholder="Enter book ID"
                    >

                </div>


                <!-- Title -->

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter book title"
                    >

                </div>


                <!-- Author -->

                <div class="form-group">

                    <label for="author">
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        placeholder="Enter author name"
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Science">
                            Science
                        </option>

                        <option value="Fiction">
                            Fiction
                        </option>

                        <option value="History">
                            History
                        </option>

                        <option value="Biography">
                            Biography
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Add Button -->

                <button
                    type="submit"
                    id="addButton"
                >
                    Add Book
                </button>


            </form>

        </div>


        <!-- Search Section -->

        <div class="search-section">

            <label for="searchInput">
                Search Book
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by ID, title or author..."
            >

        </div>


        <!-- Book Table -->

        <div class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>Book ID</th>

                        <th>Title</th>

                        <th>Author</th>

                        <th>Category</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="bookList">

                    <!-- Books will appear here -->

                </tbody>

            </table>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
