<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Management System</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>Product Management System</h1>


        <!-- Add Product Section -->

        <div class="form-section">

            <h2>Add Product</h2>

            <form id="productForm">


                <!-- Product Name -->

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                    >

                </div>


                <!-- Product ID -->

                <div class="form-group">

                    <label for="productId">
                        Product ID
                    </label>

                    <input
                        type="text"
                        id="productId"
                        placeholder="Enter product ID"
                    >

                </div>


                <!-- Price -->

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="Enter price"
                        min="0"
                        step="0.01"
                    >

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Furniture">
                            Furniture
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Quantity -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        placeholder="Enter quantity"
                        min="1"
                    >

                </div>


                <button
                    type="submit"
                    id="addButton"
                >
                    Add Product
                </button>


            </form>

        </div>


        <!-- Inventory Summary -->

        <div class="summary-section">

            <div class="summary-box">

                <h3>Total Products</h3>

                <p id="productCount">0</p>

            </div>


            <div class="summary-box">

                <h3>Total Inventory Value</h3>

                <p id="totalValue">₹0.00</p>

            </div>

        </div>


        <!-- Search and Filter -->

        <div class="search-filter-section">


            <!-- Search -->

            <div class="search-box">

                <label for="searchInput">
                    Search Product
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by name or ID..."
                >

            </div>


            <!-- Filter -->

            <div class="filter-box">

                <label for="filterCategory">
                    Filter by Category
                </label>

                <select id="filterCategory">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Electronics">
                        Electronics
                    </option>

                    <option value="Clothing">
                        Clothing
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Books">
                        Books
                    </option>

                    <option value="Furniture">
                        Furniture
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


        </div>


        <!-- Product Table -->

        <div class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>Product Name</th>

                        <th>Product ID</th>

                        <th>Price</th>

                        <th>Category</th>

                        <th>Quantity</th>

                        <th>Value</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="productList">

                    <!-- Products will appear here -->

                </tbody>

            </table>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
