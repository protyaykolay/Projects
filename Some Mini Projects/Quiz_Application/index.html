<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Application</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">


        <!-- Quiz Section -->

        <div id="quizSection">

            <h1>Quiz Application</h1>


            <!-- Quiz Header -->

            <div class="quiz-header">

                <p id="questionNumber">
                    Question 1/10
                </p>

                <p id="timer">
                    Time: 30
                </p>

            </div>


            <!-- Question -->

            <h2 id="question">
                Question will appear here
            </h2>


            <!-- Options -->

            <div id="options">

                <!-- Options will appear here -->

            </div>


            <!-- Next Button -->

            <button id="nextButton">
                Next
            </button>

        </div>


        <!-- Result Section -->

        <div id="resultSection">

            <h1>Quiz Completed!</h1>

            <h2 id="resultMessage">
                Your Result
            </h2>

            <p id="finalScore">
                Score: 0/10
            </p>

            <button id="restartButton">
                Restart Quiz
            </button>

        </div>


    </div>


    <script src="script.js"></script>

</body>

</html>
