<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>


        <!-- Add Task Section -->

        <div class="add-task-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addButton">
                Add
            </button>

        </div>


        <!-- Search Section -->

        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search task..."
            >

        </div>


        <!-- Filter Buttons -->

        <div class="filter-section">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                class="filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->

        <div class="task-section">

            <ul id="taskList">

                <!-- Tasks will appear here -->

            </ul>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
